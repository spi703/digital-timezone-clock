<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Timezone Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕐 Digital Timezone Clock</h1>
            <p>View current time across different time zones</p>
        </div>

        <div class="main-content">
            <!-- Add Timezone Section -->
            <div class="add-timezone-section">
                <h2>Add Timezone</h2>
                <div class="add-timezone-form">
                    <select id="timezoneSelect" class="timezone-select">
                        <option value="">Select a timezone...</option>
                    </select>
                    <button class="btn-add-tz" onclick="addTimezone()">+ Add Timezone</button>
                </div>
            </div>

            <!-- Clocks Grid -->
            <div class="clocks-grid" id="clocksGrid">
                <!-- Clocks will be added here dynamically -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <p>📍 No timezones added yet. Select a timezone above to get started!</p>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 Digital Timezone Clock. Made with ❤️</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
